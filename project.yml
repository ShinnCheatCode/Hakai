name: ThreeOneOSFive

options:
  bundleIdPrefix: com.mhieuushinn
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  ThreeOneOSFive:
    type: application
    platform: iOS

    sources:
      - path: ThreeOneOSFive

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhieuushinn.threeoneosfive
        INFOPLIST_FILE: ThreeOneOSFive/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h

    resources:
      - path: ThreeOneOSFive/Assets.xcassets
      - path: ThreeOneOSFive/en.lproj
      - path: ThreeOneOSFive/vi.lproj
      - path: ThreeOneOSFive/zh-Hans.lproj