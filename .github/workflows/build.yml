name: Build ThreeOneOSFive

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threeoneosfive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ThreeOneOSFive
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # =========================
      # 1. CHECKOUT
      # =========================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================
      # 2. XCODE
      # =========================
      - name: Check Xcode
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p

      # =========================
      # 3. CHECK PROJECT
      # =========================
      - name: Check project
        shell: bash
        run: |
          set -euo pipefail

          test -d "ThreeOneOSFive.xcodeproj"
          test -f "ThreeOneOSFive.xcodeproj/project.pbxproj"

          echo "Xcode project OK"

      # =========================
      # 4. ORGANIZE SOURCE
      # =========================
      - name: Organize source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "ThreeOneOSFive"

          # Root Swift / plist files
          for file in \
            "App.swift" \
            "ContentView.swift" \
            "Info.plist" \
            "ThreeOneOSFive-Bridging-Header.h"
          do
            if [ -f "$file" ]; then
              if [ ! -f "ThreeOneOSFive/$file" ]; then
                mv "$file" "ThreeOneOSFive/$file"
              fi
            fi
          done

          # Source folders
          for dir in \
            "helpers" \
            "views" \
            "vi.lproj" \
            "zh-Hans.lproj" \
            "en.lproj" \
            "exploit" \
            "kexploit"
          do
            if [ -d "$dir" ]; then

              mkdir -p "ThreeOneOSFive/$dir"

              cp -R "$dir"/. "ThreeOneOSFive/$dir"/

              rm -rf "$dir"
            fi
          done

          echo ""
          echo "===== SOURCE ====="

          find "ThreeOneOSFive" \
            -maxdepth 2 \
            -print | sort

      # =========================
      # 5. VERIFY CODE
      # =========================
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f "ThreeOneOSFive/App.swift"
          test -f "ThreeOneOSFive/ContentView.swift"
          test -f "ThreeOneOSFive/Info.plist"

          echo "App.swift       OK"
          echo "ContentView     OK"
          echo "Info.plist      OK"

      # =========================
      # 6. SHOW SCHEME
      # =========================
      - name: Check schemes
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -list \
            -project "ThreeOneOSFive.xcodeproj"

      # =========================
      # 7. CLEAN
      # =========================
      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean

      # =========================
      # 8. BUILD
      # =========================
      - name: Build unsigned
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # =========================
      # 9. FIND APP
      # =========================
      - name: Find app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \
            -name "ThreeOneOSFive.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ThreeOneOSFive.app not found."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "App found:"
          echo "$APP_PATH"

      # =========================
      # 10. CREATE IPA
      # =========================
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Payload"

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$APP_PATH" \
            "$RUNNER_TEMP/Payload/ThreeOneOSFive.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip \
            -qry \
            "ThreeOneOSFive-unsigned.ipa" \
            Payload

          test -f "ThreeOneOSFive-unsigned.ipa"

          echo ""
          echo "IPA created:"
          ls -lh "ThreeOneOSFive-unsigned.ipa"

      # =========================
      # 11. UPLOAD IPA
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # =========================
      # 12. LOGS IF FAILED
      # =========================
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-build-logs
          path: |
            ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7