      - name: Ensure Assets.xcassets
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="ThreeOneOSFive/Assets.xcassets"
          mkdir -p "$ASSETS/AppIcon.appiconset"
          mkdir -p "$ASSETS/Max.imageset"
          mkdir -p "$ASSETS/Normal.imageset"

          if [ ! -f "$ASSETS/Contents.json" ]; then
            cat > "$ASSETS/Contents.json" <<'EOF'
          {
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          fi

          if [ ! -f "$ASSETS/AppIcon.appiconset/Contents.json" ]; then
            cat > "$ASSETS/AppIcon.appiconset/Contents.json" <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          fi

          # placeholder 1024x1024 nếu thiếu icon
          if [ ! -f "$ASSETS/AppIcon.appiconset/AppIcon-1024.png" ]; then
            python3 - <<'PY'
          import struct, zlib, pathlib
          path = pathlib.Path("ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          w = h = 1024
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          raw = b"".join(b"\x00" + b"\x00\x00\x00" * w for _ in range(h))
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          path.write_bytes(png)
          PY
          fi

          for set_name in Max Normal; do
            json="$ASSETS/${set_name}.imageset/Contents.json"
            png="$ASSETS/${set_name}.imageset/icon.png"
            if [ ! -f "$json" ]; then
              cat > "$json" <<EOF
          {
            "images": [
              { "filename": "icon.png", "idiom": "universal", "scale": "1x" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
            fi
            if [ ! -f "$png" ]; then
              cp "$ASSETS/AppIcon.appiconset/AppIcon-1024.png" "$png"
            fi
          done

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "ThreeOneOSFive/App.swift"
            "ThreeOneOSFive/ContentView.swift"
            "ThreeOneOSFive/Info.plist"
            "ThreeOneOSFive/Assets.xcassets"
          )

          for item in "${required[@]}"; do
            if [ ! -e "$item" ]; then
              echo "ERROR: Missing $item"
              exit 1
            fi
            echo "OK: $item"
          done

      - name: Verify optional restored files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Max.imageset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Max.imageset/icon.png"
            "ThreeOneOSFive/Assets.xcassets/Normal.imageset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Normal.imageset/icon.png"
            "ThreeOneOSFive/vi.lproj/Localizable.strings"
            "ThreeOneOSFive/zh-Hans.lproj/Localizable.strings"
            "ThreeOneOSFive/helpers/ContainerBrowserLogic.swift"
            "ThreeOneOSFive/helpers/DisplayIdentityAttribution.swift"
            "ThreeOneOSFive/helpers/FileOperationCoordinator.swift"
            "ThreeOneOSFive/helpers/PatchDraftCoordinator.swift"
            "ThreeOneOSFive/helpers/PatchPackageCodec.swift"
            "ThreeOneOSFive/views/OnboardingView.swift"
          )

          missing=0
          for file in "${files[@]}"; do
            if [ ! -e "$file" ]; then
              echo "WARN: Missing $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "Một số file optional đang thiếu. Tiếp tục build với source hiện có."
          fi