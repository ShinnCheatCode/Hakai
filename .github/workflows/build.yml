name: Build ThreeOneOSFive

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threeoneosfive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ThreeOneOSFive
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Fix source directory layout
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ThreeOneOSFive

          # Move root source files into the source directory
          for file in \
            App.swift \
            ContentView.swift \
            Info.plist \
            ThreeOneOSFive-Bridging-Header.h
          do
            if [ -f "$file" ] && [ ! -f "ThreeOneOSFive/$file" ]; then
              mv "$file" "ThreeOneOSFive/$file"
            fi
          done

          # Move source directories when they are currently at root
          for dir in \
            Assets.xcassets \
            helpers \
            views \
            vi.lproj \
            zh-Hans.lproj \
            en.lproj \
            exploit \
            kexploit
          do
            if [ -d "$dir" ] && [ ! -d "ThreeOneOSFive/$dir" ]; then
              mv "$dir" "ThreeOneOSFive/$dir"
            fi
          done

          echo "===== FINAL SOURCE TREE ====="
          find ThreeOneOSFive -maxdepth 2 -print | sort

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "ThreeOneOSFive/App.swift"
            "ThreeOneOSFive/ContentView.swift"
            "ThreeOneOSFive/Info.plist"
            "ThreeOneOSFive/Assets.xcassets"
          )

          for item in "${required[@]}"; do
            if [ ! -e "$item" ]; then
              echo "ERROR: Missing $item"
              exit 1
            fi

            echo "OK: $item"
          done

      - name: Verify restored files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/IMG_2463.jpg"
            "ThreeOneOSFive/Assets.xcassets/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Max.imageset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Max.imageset/icon.png"
            "ThreeOneOSFive/Assets.xcassets/Normal.imageset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Normal.imageset/icon.png"
            "ThreeOneOSFive/helpers/ContainerBrowserLogic.swift"
            "ThreeOneOSFive/helpers/DisplayIdentityAttribution.swift"
            "ThreeOneOSFive/helpers/FileOperationCoordinator.swift"
            "ThreeOneOSFive/helpers/PatchDraftCoordinator.swift"
            "ThreeOneOSFive/helpers/PatchPackageCodec.swift"
            "ThreeOneOSFive/vi.lproj/Localizable.strings"
            "ThreeOneOSFive/views/OnboardingView.swift"
            "ThreeOneOSFive/zh-Hans.lproj/Localizable.strings"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Check Xcode project
        shell: bash
        run: |
          set -euo pipefail

          test -f "ThreeOneOSFive.xcodeproj/project.pbxproj"

          xcodebuild \
            -list \
            -project "ThreeOneOSFive.xcodeproj"

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \
            -name "ThreeOneOSFive.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ThreeOneOSFive.app was not created."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Built app:"
          echo "$APP_PATH"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$APP_PATH" \
            "$RUNNER_TEMP/Payload/ThreeOneOSFive.app"

          cd "$RUNNER_TEMP"

          zip -qry \
            "ThreeOneOSFive-unsigned.ipa" \
            Payload

          test -f "ThreeOneOSFive-unsigned.ipa"

          ls -lh "ThreeOneOSFive-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-build-logs
          path: |
            ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7