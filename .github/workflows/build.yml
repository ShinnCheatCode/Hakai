name: Build ThreeOneOSFive

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threeoneosfive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ThreeOneOSFive
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # =========================
      # 1. CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================
      # 2. XCODE
      # =========================
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      # =========================
      # 3. CHECK PROJECT
      # =========================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== XCODE PROJECT ====="

          if [ ! -f "ThreeOneOSFive.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: ThreeOneOSFive.xcodeproj/project.pbxproj not found."
            exit 1
          fi

          echo "Xcode project: OK"

          echo ""
          echo "===== SOURCE ====="

          test -f "ThreeOneOSFive/App.swift"
          test -f "ThreeOneOSFive/ContentView.swift"
          test -f "ThreeOneOSFive/Info.plist"

          echo "Swift source: OK"
          echo "Info.plist: OK"

          echo ""
          echo "===== ASSETS ====="

          test -d "ThreeOneOSFive/Assets.xcassets"

          echo "Assets.xcassets: OK"

      # =========================
      # 4. CHECK IMPORTANT FILES
      # =========================
      - name: Verify restored files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/IMG_2463.jpg"
            "ThreeOneOSFive/Assets.xcassets/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Max.imageset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Max.imageset/icon.png"
            "ThreeOneOSFive/Assets.xcassets/Normal.imageset/Contents.json"
            "ThreeOneOSFive/Assets.xcassets/Normal.imageset/icon.png"
            "ThreeOneOSFive/helpers/ContainerBrowserLogic.swift"
            "ThreeOneOSFive/helpers/DisplayIdentityAttribution.swift"
            "ThreeOneOSFive/helpers/FileOperationCoordinator.swift"
            "ThreeOneOSFive/helpers/PatchDraftCoordinator.swift"
            "ThreeOneOSFive/helpers/PatchPackageCodec.swift"
            "ThreeOneOSFive/vi.lproj/Localizable.strings"
            "ThreeOneOSFive/views/OnboardingView.swift"
            "ThreeOneOSFive/zh-Hans.lproj/Localizable.strings"
          )

          missing=0

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "ERROR: $missing required file(s) are missing."
            exit 1
          fi

          echo ""
          echo "All restored files are present."

      # =========================
      # 5. SHOW PROJECT TARGET
      # =========================
      - name: Check Xcode schemes
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -list \
            -project "ThreeOneOSFive.xcodeproj"

      # =========================
      # 6. CLEAN
      # =========================
      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean

      # =========================
      # 7. BUILD
      # =========================
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # =========================
      # 8. FIND APP
      # =========================
      - name: Find built app
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BUILD PRODUCTS ====="

          find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find \
            "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \
            -name "ThreeOneOSFive.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ThreeOneOSFive.app was not created."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "Built app:"
          echo "$APP_PATH"

      # =========================
      # 9. CREATE IPA
      # =========================
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Payload"

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" \
            "$RUNNER_TEMP/Payload/ThreeOneOSFive.app"

          cd "$RUNNER_TEMP"

          rm -f "ThreeOneOSFive-unsigned.ipa"

          /usr/bin/zip \
            -qry \
            "ThreeOneOSFive-unsigned.ipa" \
            "Payload"

          test -f "$RUNNER_TEMP/ThreeOneOSFive-unsigned.ipa"

          echo ""
          echo "IPA created successfully:"
          ls -lh "$RUNNER_TEMP/ThreeOneOSFive-unsigned.ipa"

      # =========================
      # 10. UPLOAD IPA
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # =========================
      # 11. UPLOAD APP LOG
      # =========================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-build-logs
          path: |
            ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7