name: Build ThreeOneOSFive

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository
        shell: bash
        run: |
          set -e

          echo "===== ROOT ====="
          pwd
          ls -la

          echo "===== XCODE PROJECTS ====="
          find . -maxdepth 4 \
            -name "*.xcodeproj" \
            -print

          echo "===== WORKSPACES ====="
          find . -maxdepth 4 \
            -name "*.xcworkspace" \
            -print

      - name: Find Xcode project
        shell: bash
        run: |
          set -e

          PROJECT=$(find . -maxdepth 4 -name "ThreeOneOSFive.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ThreeOneOSFive.xcodeproj not found."
            echo "Available Xcode projects:"
            find . -maxdepth 5 -name "*.xcodeproj" -print
            exit 1
          fi

          PROJECT="${PROJECT#./}"

          echo "Found project:"
          echo "$PROJECT"

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Check project and schemes
        shell: bash
        run: |
          set -e

          echo "Project: $PROJECT_PATH"

          xcodebuild \
            -list \
            -project "$PROJECT_PATH"

      - name: Build unsigned
        shell: bash
        run: |
          set -e

          echo "Building $PROJECT_PATH"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Find built app
        shell: bash
        run: |
          set -e

          echo "===== BUILT APPS ====="

          find "$RUNNER_TEMP/DerivedData" \
            -name "*.app" \
            -type d \
            -print

      - name: Package IPA
        shell: bash
        run: |
          set -e

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app was not created."
            exit 1
          fi

          echo "Using app:"
          echo "$APP_PATH"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          zip -qry \
            "ThreeOneOSFive-unsigned.ipa" \
            Payload

          test -f "ThreeOneOSFive-unsigned.ipa"

          echo "IPA created successfully."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error
          retention-days: 7