name: Build 3105

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threeoneosfive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 3105
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Fix project file name
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "ThreeOneOSFive.xcodeproj"

          # repo đang có file tên lệch " project.pbxproj"
          if [ -f "ThreeOneOSFive.xcodeproj/ project.pbxproj" ] && [ ! -s "ThreeOneOSFive.xcodeproj/project.pbxproj" ]; then
            mv "ThreeOneOSFive.xcodeproj/ project.pbxproj" "ThreeOneOSFive.xcodeproj/project.pbxproj"
          fi

          test -f "ThreeOneOSFive.xcodeproj/project.pbxproj"
          echo "project.pbxproj OK"

      - name: Organize source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "ThreeOneOSFive"

          for file in \
            "App.swift" \
            "ContentView.swift" \
            "Info.plist" \
            "ThreeOneOSFive-Bridging-Header.h"
          do
            if [ -f "$file" ] && [ ! -f "ThreeOneOSFive/$file" ]; then
              mv "$file" "ThreeOneOSFive/$file"
            fi
          done

          for dir in \
            "helpers" \
            "views" \
            "vi.lproj" \
            "zh-Hans.lproj" \
            "en.lproj" \
            "exploit" \
            "kexploit" \
            "Assets.xcassets"
          do
            if [ -d "$dir" ]; then
              mkdir -p "ThreeOneOSFive/$dir"
              cp -R "$dir"/. "ThreeOneOSFive/$dir"/
              rm -rf "$dir"
            fi
          done

          find "ThreeOneOSFive" -maxdepth 2 -print | sort

      - name: Ensure minimal Assets.xcassets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="ThreeOneOSFive/Assets.xcassets"
          mkdir -p "$ASSETS/AppIcon.appiconset" "$ASSETS/Max.imageset" "$ASSETS/Normal.imageset"

          [ -f "$ASSETS/Contents.json" ] || cat > "$ASSETS/Contents.json" <<'EOF'
          {
            "info": { "author": "xcode", "version": 1 }
          }
          EOF

          [ -f "$ASSETS/AppIcon.appiconset/Contents.json" ] || cat > "$ASSETS/AppIcon.appiconset/Contents.json" <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF

          if [ ! -f "$ASSETS/AppIcon.appiconset/AppIcon-1024.png" ]; then
            python3 - <<'PY'
          import struct, zlib, pathlib
          path = pathlib.Path("ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          w = h = 1024
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          raw = b"".join(b"\x00" + (b"\x00\x00\x00" * w) for _ in range(h))
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          path.write_bytes(png)
          PY
          fi

          for name in Max Normal; do
            [ -f "$ASSETS/${name}.imageset/Contents.json" ] || cat > "$ASSETS/${name}.imageset/Contents.json" <<EOF
          {
            "images": [
              { "filename": "icon.png", "idiom": "universal", "scale": "1x" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
            [ -f "$ASSETS/${name}.imageset/icon.png" ] || cp "$ASSETS/AppIcon.appiconset/AppIcon-1024.png" "$ASSETS/${name}.imageset/icon.png"
          done

      - name: Create shared scheme
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes"

          cat > "ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/3105.xcscheme" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1540"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "YES"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "3105A001"
                         BuildableName = "3105.app"
                         BlueprintName = "3105"
                         ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <LaunchAction
                buildConfiguration = "Release"
                selectedDebuggerIdentifier = ""
                selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.PosixSpawn"
                launchStyle = "0"
                useCustomWorkingDirectory = "NO"
                ignoresPersistentStateOnLaunch = "NO"
                debugDocumentVersioning = "YES"
                debugServiceExtension = "internal"
                allowLocationSimulation = "YES">
                <BuildableProductRunnable
                   runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "3105A001"
                      BuildableName = "3105.app"
                      BlueprintName = "3105"
                      ReferencedContainer = "container:ThreeOneOSFive.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction
                buildConfiguration = "Release"
                shouldUseLaunchSchemeArgsEnv = "YES"
                savedToolIdentifier = ""
                useCustomWorkingDirectory = "NO"
                debugDocumentVersioning = "YES">
             </ProfileAction>
             <AnalyzeAction
                buildConfiguration = "Release">
             </AnalyzeAction>
             <ArchiveAction
                buildConfiguration = "Release"
                revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "ThreeOneOSFive.xcodeproj"

      - name: Build unsigned
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \( -name "3105.app" -o -name "ThreeOneOSFive.app" \) \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: app not found"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "App found: $APP_PATH"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/$(basename "$APP_PATH")"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "3105-unsigned.ipa" Payload
          test -f "3105-unsigned.ipa"
          ls -lh "3105-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned
          path: ${{ runner.temp }}/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-logs
          path: ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7