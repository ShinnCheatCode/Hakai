name: Build ThreeOneOSFive

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threeoneosfive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ThreeOneOSFive
    runs-on: macos-14
    timeout-minutes: 45

    steps:

      # =========================================
      # 1. CHECKOUT
      # =========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================
      # 2. CHECK XCODE
      # =========================================
      - name: Check Xcode
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p

      # =========================================
      # 3. CHECK PROJECT
      # =========================================
      - name: Check project
        shell: bash
        run: |
          set -euo pipefail

          test -d "ThreeOneOSFive.xcodeproj"
          test -f "ThreeOneOSFive.xcodeproj/project.pbxproj"

          echo "Xcode project OK"

      # =========================================
      # 4. ORGANIZE SOURCE
      # =========================================
      - name: Organize source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "ThreeOneOSFive"

          for file in \
            "App.swift" \
            "ContentView.swift" \
            "Info.plist" \
            "ThreeOneOSFive-Bridging-Header.h"
          do
            if [ -f "$file" ] && [ ! -f "ThreeOneOSFive/$file" ]; then
              mv "$file" "ThreeOneOSFive/$file"
            fi
          done

          for dir in \
            "helpers" \
            "views" \
            "vi.lproj" \
            "zh-Hans.lproj" \
            "en.lproj"
          do
            if [ -d "$dir" ]; then
              mkdir -p "ThreeOneOSFive/$dir"
              cp -R "$dir"/. "ThreeOneOSFive/$dir"/
              rm -rf "$dir"
            fi
          done

          echo "===== SOURCE TREE ====="
          find "ThreeOneOSFive" -maxdepth 2 -print | sort

      # =========================================
      # 5. VERIFY SOURCE
      # =========================================
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f "ThreeOneOSFive/App.swift"
          test -f "ThreeOneOSFive/ContentView.swift"
          test -f "ThreeOneOSFive/Info.plist"

          echo "App.swift OK"
          echo "ContentView.swift OK"
          echo "Info.plist OK"

      # =========================================
      # 6. LIST TARGETS
      # =========================================
      - name: Check Xcode targets
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -list \
            -project "ThreeOneOSFive.xcodeproj"

      # =========================================
      # 7. PREPARE BUILD DIRECTORY
      # =========================================
      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Build"
          mkdir -p "$RUNNER_TEMP/Build"

          echo "Build directory:"
          echo "$RUNNER_TEMP/Build"

      # =========================================
      # 8. CLEAN
      # =========================================
      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            SYMROOT="$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean

      # =========================================
      # 9. BUILD
      # =========================================
      - name: Build unsigned
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            SYMROOT="$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # =========================================
      # 10. FIND APP
      # =========================================
      - name: Find built app
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BUILD OUTPUT ====="

          find "$RUNNER_TEMP/Build" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find \
            "$RUNNER_TEMP/Build" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was created."
            echo ""
            echo "Build directory contents:"
            find "$RUNNER_TEMP/Build" -maxdepth 5 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "APP FOUND:"
          echo "$APP_PATH"

      # =========================================
      # 11. CREATE IPA
      # =========================================
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$APP_PATH" \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          rm -f "ThreeOneOSFive-unsigned.ipa"

          /usr/bin/zip \
            -qry \
            "ThreeOneOSFive-unsigned.ipa" \
            "Payload"

          test -f "ThreeOneOSFive-unsigned.ipa"

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh "ThreeOneOSFive-unsigned.ipa"

      # =========================================
      # 12. UPLOAD IPA
      # =========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # =========================================
      # 13. UPLOAD LOGS IF FAILED
      # =========================================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-build-logs
          path: |
            ${{ runner.temp }}/Build
          if-no-files-found: ignore
          retention-days: 7