name: Build 3105

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threeoneosfive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 3105
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Organize source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ThreeOneOSFive/helpers
          mkdir -p ThreeOneOSFive/views

          # File lẻ ở ROOT -> helpers
          for file in \
            ContainerBrowserLogic.swift \
            DisplayIdentityAttribution.swift \
            FileOperationCoordinator.swift \
            PatchDraftCoordinator.swift \
            PatchPackageCodec.swift
          do
            if [ -f "$file" ]; then
              mv -f "$file" "ThreeOneOSFive/helpers/$file"
              echo "MOVED $file -> ThreeOneOSFive/helpers/"
            fi
          done

          # Onboarding nếu bị up nhầm root
          if [ -f "OnboardingView.swift" ]; then
            mv -f "OnboardingView.swift" "ThreeOneOSFive/views/OnboardingView.swift"
          fi

          # File app ở root
          for file in \
            App.swift \
            ContentView.swift \
            Info.plist \
            ThreeOneOSFive-Bridging-Header.h
          do
            if [ -f "$file" ] && [ ! -f "ThreeOneOSFive/$file" ]; then
              mv "$file" "ThreeOneOSFive/$file"
            fi
          done

          # Folder ở root
          for dir in \
            Assets.xcassets helpers views \
            vi.lproj zh-Hans.lproj en.lproj \
            exploit kexploit
          do
            if [ -d "$dir" ]; then
              mkdir -p "ThreeOneOSFive/$dir"
              cp -R "$dir"/. "ThreeOneOSFive/$dir"/
              rm -rf "$dir"
            fi
          done

          echo "===== helpers ====="
          ls -1 ThreeOneOSFive/helpers || true
          echo "===== views ====="
          ls -1 ThreeOneOSFive/views || true

      - name: Ensure Assets.xcassets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="ThreeOneOSFive/Assets.xcassets"
          mkdir -p "$ASSETS/AppIcon.appiconset" "$ASSETS/Max.imageset" "$ASSETS/Normal.imageset"
          [ -f "$ASSETS/Contents.json" ] || echo '{"info":{"author":"xcode","version":1}}' > "$ASSETS/Contents.json"

      - name: Create shared scheme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes
          cat > ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/3105.xcscheme <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1540" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="3105A001" BuildableName="3105.app" BlueprintName="3105" ReferencedContainer="container:ThreeOneOSFive.xcodeproj"/>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <LaunchAction buildConfiguration="Release" selectedDebuggerIdentifier="" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.PosixSpawn" launchStyle="0" useCustomWorkingDirectory="NO">
              <BuildableProductRunnable runnableDebuggingMode="0">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="3105A001" BuildableName="3105.app" BlueprintName="3105" ReferencedContainer="container:ThreeOneOSFive.xcodeproj"/>
              </BuildableProductRunnable>
            </LaunchAction>
            <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES"/>
            <AnalyzeAction buildConfiguration="Release"/>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          EOF

      - name: List schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \( -name "3105.app" -o -name "ThreeOneOSFive.app" \) -print -quit)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/$(basename "$APP_PATH")"
          cd "$RUNNER_TEMP"
          zip -qry 3105-unsigned.ipa Payload
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned
          path: ${{ runner.temp }}/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-logs
          path: ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7